<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Surveillance visio</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Surveillance visio</h1>
      <p id="state">Clique sur « Choisir la fenêtre ».</p>
    </div>
    <span id="badge">OFF</span>
  </header>

  <div class="row">
    <button id="start" class="primary">Choisir la fenêtre</button>
    <button id="stop" disabled>Arrêter</button>
    <button id="minimize" disabled>Réduire</button>
  </div>

  <video id="preview" autoplay muted playsinline></video>

  <section>
    <div class="label">Sous-titres</div>
    <div id="finalTranscript"></div>
    <div id="interimTranscript"></div>
  </section>

  <section>
    <div class="label">Statut</div>
    <div id="status"></div>
  </section>
</main>
<script src="capture.js"></script>
</body>
</html>
