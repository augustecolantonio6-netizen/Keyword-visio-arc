<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visio — transcription</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Transcription visio</h1>
      <p id="state">Clique sur « Choisir la fenêtre ».</p>
    </div>
    <span id="badge">OFF</span>
  </header>

  <div class="toolbar">
    <button id="start" class="primary">Choisir la fenêtre</button>
    <button id="stop" disabled>Arrêter</button>
    <button id="minimize" disabled>Réduire</button>
  </div>

  <details id="transcriptDetails">
    <summary>
      <span>Sous-titres en direct</span>
      <span class="audio-meter">Audio <strong id="audioLevel">—</strong></span>
    </summary>
    <div id="transcriptContent">
      <div class="transcript-tools">
        <span class="label">Transcription de la visio</span>
        <div class="transcript-actions">
          <button id="downloadTranscript" type="button">Télécharger .txt</button>
          <button id="transcriptFullscreen" type="button">Plein écran</button>
        </div>
      </div>
      <video id="preview" autoplay muted playsinline></video>
      <div id="finalTranscript" aria-live="polite"></div>
      <div id="interimTranscript"></div>
      <div id="status"></div>
    </div>
  </details>
</main>
<script src="capture.js"></script>
</body>
</html>
