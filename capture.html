<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Surveillance visio</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Surveillance de la visio</h1>
      <p id="state">Choisis la fenêtre de ta visio.</p>
    </div>
    <span id="badge">OFF</span>
  </div>

  <div class="buttons">
    <button id="start" class="primary">Choisir la fenêtre</button>
    <button id="stop" disabled>Arrêter</button>
    <button id="chat">Chat</button>
  </div>

  <video id="preview" muted autoplay playsinline></video>

  <div class="title">Sous-titres récents</div>
  <div id="transcript"></div>

  <div class="title">Enregistrement écran</div>
  <div id="recordStatus">Désactivé</div>
</main>
<script src="capture.js"></script>
</body>
</html>
